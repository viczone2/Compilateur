name: build
on:
  workflow_dispatch:
    inputs:
      job:
        description: Identifiant du build
        required: true
      mode:
        description: zip ou git
        required: true
      url:
        description: URL du depot git
        required: false
        default: ''
      branch:
        description: Branche git
        required: false
        default: ''
      java:
        description: Version de Java
        required: true
        default: '17'
      command:
        description: Commande personnalisee
        required: false
        default: ''
      gradle:
        description: Version de Gradle
        required: false
        default: '8.8'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB: ${{ inputs.job }}
      MODE: ${{ inputs.mode }}
      URL: ${{ inputs.url }}
      BRANCH: ${{ inputs.branch }}
      CMD: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle }}
      - name: Compiler
        run: |
          set +e
          mkdir -p /tmp/res src
          (
            set -e
            if [ "$MODE" = git ]; then
              case "$URL" in https://*) ;; *) echo "URL invalide"; exit 1;; esac
              if [ -n "$BRANCH" ]; then git clone --depth 1 -b "$BRANCH" "$URL" src; else git clone --depth 1 "$URL" src; fi
            else
              unzip -q "inbox/$JOB.zip" -d src
            fi
            cd src
            if [ "$(ls -A | wc -l)" = 1 ] && [ -d "$(ls -A)" ]; then cd "$(ls -A)"; fi
            echo "Java $(java -version 2>&1 | head -1)"
            if [ -n "$CMD" ]; then bash -c "$CMD"
            elif [ -f pom.xml ]; then mvn -B package -DskipTests
            elif [ -f gradlew ]; then chmod +x gradlew; ./gradlew build -x test --no-daemon
            elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then gradle build -x test --no-daemon
            else
              echo "Aucun pom/gradle detecte : compilation avec javac"
              rm -rf out; mkdir -p out/classes
              find . -name '*.java' -not -path './out/*' > out/src.txt
              [ -s out/src.txt ] || { echo "Aucun fichier .java trouve."; exit 1; }
              CP=""; [ -d libs ] && CP="-cp libs/*"
              javac -encoding UTF-8 $CP -d out/classes @out/src.txt
              if [ -d src/main/resources ]; then cp -r src/main/resources/. out/classes/; fi
              for f in plugin.yml paper-plugin.yml bungee.yml fabric.mod.json mcmod.info pack.mcmeta config.yml; do if [ -f "$f" ]; then cp "$f" out/classes/; fi; done
              jar cf out/result.jar -C out/classes .
            fi
            find . -type f -name '*.jar' -regex '.*/\(target\|build\|out\)/.*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*' -exec cp {} /tmp/res/ \;
            ls /tmp/res/*.jar > /dev/null 2>&1 || { echo "Build termine, mais aucun .jar trouve."; exit 1; }
          ) 2>&1 | tee /tmp/res/build.log
          echo "${PIPESTATUS[0]}" > /tmp/res/code
      - name: Nettoyer
        if: always()
        run: |
          git rm -q -f "inbox/$JOB.zip" 2>/dev/null && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "nettoyage $JOB" && git push -q || true
      - name: Publier le resultat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub/"$JOB" && cd /tmp/pub
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q -b output
          cp /tmp/res/*.jar /tmp/res/build.log "$JOB"/ 2>/dev/null || true
          if [ "$(cat /tmp/res/code 2>/dev/null)" = 0 ]; then echo ok > "$JOB/status.txt"; else echo error > "$JOB/status.txt"; fi
          git add -A
          git commit -q -m "build $JOB"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
